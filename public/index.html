<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selenia — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030508;
    --bg2: rgba(6, 18, 32, 0.88);
    --bg3: rgba(4, 24, 42, 0.78);
    --border: rgba(0, 212, 255, 0.22);
    --border-bright: rgba(0, 229, 255, 0.5);
    --text: #e8f4ff;
    --text2: #6b8aa0;
    --hud: #00e5ff;
    --hud-dim: #0097a7;
    --accent: #00b4d8;
    --accent2: #48cae4;
    --reactor: #ff6b35;
    --green: #00ffa3;
    --red: #ff4d6d;
    --orange: #ffb703;
    --blue: #4cc9f0;
    --pink: #f72585;
    --cyan: #90e0ef;
    --radius: 2px;
    --hud-glow: 0 0 22px rgba(0, 229, 255, 0.12), 0 0 48px rgba(0, 180, 216, 0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Rajdhani', system-ui, sans-serif;
    font-weight: 500;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 120% 70% at 50% -25%, rgba(0, 180, 216, 0.16), transparent 50%),
      radial-gradient(ellipse 50% 45% at 100% 100%, rgba(255, 107, 53, 0.07), transparent 50%),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 229, 255, 0.025) 2px, rgba(0, 229, 255, 0.025) 4px);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::after {
    content: '';
    pointer-events: none;
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.22;
    background: linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px);
    background-size: 100% 4px;
    animation: hudScan 16s linear infinite;
  }
  @keyframes hudScan {
    from { transform: translateY(0); }
    to { transform: translateY(20px); }
  }
  .main { position: relative; z-index: 1; }

  /* === HEADER === */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 26px;
    background: linear-gradient(180deg, rgba(4, 22, 38, 0.97) 0%, rgba(2, 10, 22, 0.94) 100%);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 36px rgba(0, 0, 0, 0.45), inset 0 -1px 0 rgba(0, 229, 255, 0.12);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(14px);
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 44px; height: 44px;
    position: relative;
    background: conic-gradient(from 210deg, var(--reactor), var(--hud), var(--hud-dim), var(--reactor));
    clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900; font-size: 15px; color: #fff;
    text-shadow: 0 0 14px rgba(0, 229, 255, 0.85);
    box-shadow: 0 0 26px rgba(0, 229, 255, 0.35), inset 0 0 18px rgba(0, 0, 0, 0.45);
  }
  .logo::after {
    content: '';
    position: absolute;
    inset: 5px;
    background: radial-gradient(circle, rgba(0, 36, 56, 0.95) 0%, #020810 72%);
    clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    z-index: -1;
  }
  .logo--sm { width: 32px; height: 32px; font-size: 11px; }
  .logo--sm::after { inset: 4px; }
  .header-title-wrap { display: flex; flex-direction: column; gap: 3px; }
  .header-title-wrap h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #fff 0%, var(--accent2) 45%, var(--hud) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.35));
  }
  .hud-subline {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--hud-dim);
    opacity: 0.92;
  }
  .header-right { display: flex; align-items: center; gap: 18px; }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green), 0 0 22px rgba(0, 255, 163, 0.35);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.9); }
  }
  .status-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--accent2);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .uptime {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--hud);
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: rgba(0, 28, 44, 0.55);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }

  /* === LAYOUT === */
  .main { display: grid; grid-template-columns: 1fr 400px; gap: 0; min-height: calc(100vh - 70px); }
  .content { padding: 26px; overflow-y: auto; }
  .sidebar {
    background: linear-gradient(180deg, rgba(3, 18, 32, 0.94) 0%, rgba(2, 8, 18, 0.97) 100%);
    border-left: 1px solid var(--border);
    box-shadow: inset 10px 0 36px rgba(0, 0, 0, 0.28);
    display: flex; flex-direction: column;
  }

  /* === METRICS === */
  .metrics-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 26px;
  }
  .metric-card {
    position: relative;
    background: var(--bg2);
    border: 1px solid var(--border);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    padding: 18px 12px;
    text-align: center;
    box-shadow: var(--hud-glow);
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .metric-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-bright), transparent);
    opacity: 0.65;
  }
  .metric-card:hover { border-color: var(--border-bright); box-shadow: 0 0 28px rgba(0, 229, 255, 0.14); }
  .metric-card .value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.65rem;
    font-weight: 700;
    background: linear-gradient(180deg, #fff 0%, var(--accent2) 50%, var(--hud) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.35));
  }
  .metric-card .label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin-top: 8px;
  }

  /* === MODULES === */
  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.32em;
    color: var(--hud-dim);
    margin-bottom: 14px;
    font-weight: 600;
    padding-left: 12px;
    border-left: 3px solid var(--hud);
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
  }
  .modules-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 26px;
  }
  .mod-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    padding: 20px;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }
  .mod-card:hover {
    border-color: var(--border-bright);
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0, 229, 255, 0.12);
  }
  .mod-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    box-shadow: 0 0 14px currentColor;
  }
  .mod-card[data-module="gastronomia"]::before { background: var(--orange); color: var(--orange); }
  .mod-card[data-module="logistica"]::before { background: var(--blue); color: var(--blue); }
  .mod-card[data-module="onbox-market"]::before { background: var(--green); color: var(--green); }
  .mod-card[data-module="retail"]::before { background: var(--pink); color: var(--pink); }
  .mod-card[data-module="sistemas"]::before { background: var(--cyan); color: var(--cyan); }
  .mod-card[data-module="financiera"]::before { background: var(--accent2); color: var(--accent2); }
  .mod-card .mod-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .mod-card .mod-icon { font-size: 26px; filter: drop-shadow(0 0 6px rgba(255,255,255,0.15)); }
  .mod-card .mod-status {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; padding: 4px 10px;
    clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
    text-transform: uppercase; font-weight: 700; letter-spacing: 0.12em;
  }
  .mod-status.running { background: rgba(0, 255, 163, 0.1); color: var(--green); border: 1px solid rgba(0, 255, 163, 0.35); }
  .mod-status.error { background: rgba(255, 77, 109, 0.1); color: var(--red); border: 1px solid rgba(255, 77, 109, 0.35); }
  .mod-status.booting { background: rgba(255, 183, 3, 0.1); color: var(--orange); border: 1px solid rgba(255, 183, 3, 0.35); }
  .mod-card .mod-name { font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; margin-bottom: 6px; }
  .mod-card .mod-desc { font-size: 13px; color: var(--text2); margin-bottom: 12px; line-height: 1.35; }
  .mod-card .mod-stats { display: flex; gap: 12px; }
  .mod-card .mod-stat { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--text2); display: flex; align-items: center; gap: 4px; }
  .mod-card .mod-stat .num { color: var(--hud); font-weight: 700; font-size: 13px; }

  /* === EVENTS === */
  .event-stream {
    background: var(--bg2);
    border: 1px solid var(--border);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    padding: 18px;
    max-height: 320px;
    overflow-y: auto;
    box-shadow: var(--hud-glow);
  }
  .event-stream::-webkit-scrollbar { width: 5px; }
  .event-stream::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.22); }
  .event-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(0, 229, 255, 0.08);
    font-size: 11px;
    font-family: 'Share Tech Mono', monospace;
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
  .event-item:last-child { border-bottom: none; }
  .event-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
  .event-time { color: var(--hud-dim); flex-shrink: 0; }
  .event-type { color: var(--accent2); font-weight: 700; text-shadow: 0 0 10px rgba(72, 202, 228, 0.3); }
  .event-payload { color: var(--text2); word-break: break-all; font-size: 11px; }

  /* === CHAT === */
  .chat-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    background: rgba(0, 28, 44, 0.45);
  }
  .chat-messages { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .chat-messages::-webkit-scrollbar { width: 5px; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.2); }
  .chat-msg {
    max-width: 92%;
    padding: 12px 14px;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    font-size: 14px;
    line-height: 1.5;
    animation: fadeIn 0.3s ease;
  }
  .chat-msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(0, 180, 216, 0.42), rgba(0, 100, 140, 0.55));
    border: 1px solid rgba(0, 229, 255, 0.45);
    color: #fff;
    box-shadow: 0 0 18px rgba(0, 229, 255, 0.12);
  }
  .chat-msg.ai {
    align-self: flex-start;
    background: rgba(4, 22, 38, 0.92);
    border: 1px solid var(--border);
    box-shadow: inset 0 0 22px rgba(0, 229, 255, 0.04);
  }
  .chat-msg.ai .sender {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px; color: var(--hud); font-weight: 700; margin-bottom: 6px;
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  .chat-msg.system {
    align-self: center;
    background: rgba(0, 36, 54, 0.45);
    border: 1px dashed rgba(0, 229, 255, 0.28);
    color: var(--text2);
    font-size: 11px;
    font-family: 'Share Tech Mono', monospace;
    text-align: center;
    padding: 10px 12px;
    clip-path: none;
    border-radius: 2px;
  }
  .chat-input-area {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    display: flex; gap: 10px;
    background: rgba(0, 12, 24, 0.55);
  }
  .chat-input {
    flex: 1;
    background: rgba(2, 16, 30, 0.92);
    border: 1px solid var(--border);
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Rajdhani', sans-serif;
    outline: none;
    resize: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .chat-input:focus { border-color: var(--border-bright); box-shadow: 0 0 16px rgba(0, 229, 255, 0.12); }
  .chat-input::placeholder { color: var(--text2); }
  .chat-send {
    background: linear-gradient(180deg, rgba(0, 229, 255, 0.32), rgba(0, 100, 150, 0.55));
    border: 1px solid var(--border-bright);
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    width: 46px;
    cursor: pointer;
    color: #fff;
    font-size: 17px;
    font-family: 'Orbitron', sans-serif;
    transition: box-shadow 0.2s, transform 0.15s;
  }
  .chat-send:hover { box-shadow: 0 0 22px rgba(0, 229, 255, 0.35); transform: scale(1.04); }
  .chat-send:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  /* === MODAL === */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 4, 12, 0.82);
    backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
    z-index: 200;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: linear-gradient(165deg, rgba(6, 28, 48, 0.98), rgba(2, 10, 22, 0.99));
    border: 1px solid var(--border-bright);
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
    width: min(600px, 94vw); max-height: 82vh;
    overflow-y: auto; padding: 24px;
    box-shadow: 0 0 56px rgba(0, 229, 255, 0.12), 0 24px 72px rgba(0, 0, 0, 0.55);
  }
  .modal h2 { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; letter-spacing: 0.1em; margin-bottom: 14px; color: var(--accent2); }
  .modal .close {
    float: right;
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid var(--border);
    color: var(--hud);
    cursor: pointer;
    font-size: 15px;
    width: 34px; height: 34px;
    line-height: 30px;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  }
  .modal .cmd-list { display: flex; flex-direction: column; gap: 10px; }
  .modal .cmd-item {
    background: rgba(0, 22, 38, 0.7);
    border: 1px solid var(--border);
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .modal .cmd-item:hover { border-color: var(--border-bright); box-shadow: 0 0 18px rgba(0, 229, 255, 0.1); }
  .modal .cmd-name { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 11px; color: var(--hud); letter-spacing: 0.06em; }
  .modal .cmd-desc { font-size: 13px; color: var(--text2); margin-top: 4px; }

  @media (max-width: 1100px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { min-height: 400px; border-left: none; border-top: 1px solid var(--border); }
    .modules-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .modules-grid { grid-template-columns: 1fr; }
    .metrics-bar { grid-template-columns: repeat(2, 1fr); }
    .header-title-wrap h1 { letter-spacing: 0.12em; font-size: 0.88rem; }
  }

  .loading { display: inline-block; }
  .loading::after {
    content: ''; display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--hud);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    margin-left: 8px;
    vertical-align: middle;
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hud-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 10px;
    border: 1px solid var(--border);
    background: rgba(0, 40, 60, 0.5);
    color: var(--accent2);
    cursor: pointer;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .hud-btn:hover { border-color: var(--border-bright); box-shadow: 0 0 14px rgba(0, 229, 255, 0.2); }
  .hud-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--text2); letter-spacing: 0.06em; }
  .hud-input {
    width: 100%;
    margin-top: 4px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    background: rgba(2, 16, 30, 0.9);
    color: var(--text);
    font-size: 11px;
    font-family: 'Share Tech Mono', monospace;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  }
  .hud-input:focus { outline: none; border-color: var(--border-bright); }
  .hud-sidebar-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--hud);
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <div class="logo">S</div>
    <div class="header-title-wrap">
      <h1>Selenia</h1>
      <span class="hud-subline">Neural HUD · OnBox command</span>
    </div>
  </div>
  <div class="header-right">
    <div style="display:flex;align-items:center;gap:6px">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Conectando...</span>
    </div>
    <span class="uptime" id="uptimeText">--:--:--</span>
  </div>
</header>

<!-- MAIN -->
<div class="main">
  <!-- LEFT: CONTENT -->
  <div class="content">
    <!-- Metrics -->
    <div class="metrics-bar">
      <div class="metric-card">
        <div class="value" id="metricModules">-</div>
        <div class="label">Módulos activos</div>
      </div>
      <div class="metric-card">
        <div class="value" id="metricEvents">-</div>
        <div class="label">Eventos hoy</div>
      </div>
      <div class="metric-card">
        <div class="value" id="metricRequests">-</div>
        <div class="label">Requests</div>
      </div>
      <div class="metric-card">
        <div class="value" id="metricErrors">-</div>
        <div class="label">Errores</div>
      </div>
    </div>

    <!-- Modules -->
    <div class="section-title">Módulos de negocio</div>
    <div class="modules-grid" id="modulesGrid"></div>

    <!-- Events -->
    <div class="section-title">Event Stream (en vivo)</div>
    <div class="event-stream" id="eventStream">
      <div style="color:var(--text2);text-align:center;padding:20px">Cargando eventos...</div>
    </div>
  </div>

  <!-- RIGHT: CHAT SIDEBAR -->
  <div class="sidebar">
    <div class="chat-header" style="flex-wrap:wrap;gap:10px">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <div class="logo logo--sm">S</div>
        <span class="hud-sidebar-title">IA · Claude</span>
      </div>
      <label class="hud-label" style="display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap">
        <input type="checkbox" id="councilLite" checked /> Council
      </label>
      <button type="button" class="hud-btn" id="newChatBtn">Nuevo chat</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div style="padding:0 14px 10px">
      <label class="hud-label" for="dispatchKeyInput">Dispatch key (opcional)</label>
      <input type="password" class="hud-input" id="dispatchKeyInput" autocomplete="off" placeholder="SELENIA_DISPATCH_KEY en Worker" />
    </div>
    <div class="chat-input-area">
      <textarea class="chat-input" id="chatInput" rows="1" placeholder="Escribí tu mensaje..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
      <button class="chat-send" id="chatSend" onclick="sendChat()">→</button>
    </div>
  </div>
</div>

<!-- MODULE DETAIL MODAL -->
<div class="modal-overlay" id="moduleModal">
  <div class="modal">
    <button class="close" onclick="closeModal()">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const API = window.location.origin;
let DEMO_MODE = false;
/** Historial Anthropic (user o assistant); no se guarda en servidor = $0 KV. */
let chatTranscript = [];
const MODULE_META = {
  gastronomia: { icon: '🍕', color: '#fdcb6e', desc: 'Pedidos, delivery, cocina, app clientes' },
  logistica: { icon: '🚚', color: '#74b9ff', desc: 'Rutas, drivers, zonas, tracking, scanner' },
  'onbox-market': { icon: '🛒', color: '#00b894', desc: 'Marketplace B2C/B2B, ML, Shopify, TN' },
  retail: { icon: '📦', color: '#fd79a8', desc: 'Inventario FIFO, stock, precios, lotes' },
  sistemas: { icon: '⚙️', color: '#81ecec', desc: 'Infra, workers, APIs, monitoring, deploys' },
  financiera: { icon: '💰', color: '#a29bfe', desc: 'AFIP, impuestos, crypto, pagos, cobranzas' },
};

const COMMANDS = {
  gastronomia: [
    { name: 'crear-pedido', desc: 'Crear nuevo pedido gastronómico' },
    { name: 'cambiar-estado-pedido', desc: 'Cambiar estado de un pedido' },
    { name: 'asignar-repartidor', desc: 'Asignar repartidor a pedido' },
    { name: 'dashboard', desc: 'Ver métricas del módulo' },
  ],
  logistica: [
    { name: 'crear-envio', desc: 'Crear nuevo envío' },
    { name: 'asignar-driver', desc: 'Asignar driver a envío' },
    { name: 'confirmar-entrega', desc: 'Confirmar entrega completada' },
    { name: 'escanear-etiqueta', desc: 'Escanear etiqueta de paquete' },
    { name: 'optimizar-rutas', desc: 'Optimizar rutas de zona' },
    { name: 'dashboard', desc: 'Ver métricas del módulo' },
  ],
  'onbox-market': [
    { name: 'listar-catalogo', desc: 'Listar catálogo de productos' },
    { name: 'checkout', desc: 'Procesar checkout de orden' },
    { name: 'sync-mercadolibre', desc: 'Sincronizar con MercadoLibre' },
    { name: 'sync-shopify', desc: 'Sincronizar con Shopify' },
    { name: 'sync-tiendanube', desc: 'Sincronizar con TiendaNube' },
    { name: 'match-b2b', desc: 'Match B2B oferta/demanda' },
    { name: 'dashboard', desc: 'Ver métricas del módulo' },
  ],
  retail: [
    { name: 'consultar-stock', desc: 'Consultar stock de producto' },
    { name: 'ingreso-stock', desc: 'Ingresar stock' },
    { name: 'deducir-stock', desc: 'Deducir stock (FIFO)' },
    { name: 'actualizar-precio', desc: 'Actualizar precio de producto' },
    { name: 'alertas-stock-bajo', desc: 'Ver alertas de stock bajo' },
    { name: 'dashboard', desc: 'Ver métricas del módulo' },
  ],
  sistemas: [
    { name: 'health-check', desc: 'Health check de servicios' },
    { name: 'deploy-preview', desc: 'Deploy a preview' },
    { name: 'deploy-produccion', desc: 'Deploy a producción' },
    { name: 'listar-workers', desc: 'Listar workers activos' },
    { name: 'logs', desc: 'Ver logs de worker' },
    { name: 'dashboard', desc: 'Ver métricas del módulo' },
  ],
  financiera: [
    { name: 'emitir-factura', desc: 'Emitir factura AFIP' },
    { name: 'consultar-ultimo-cbte', desc: 'Consultar último comprobante' },
    { name: 'calcular-iva', desc: 'Calcular IVA' },
    { name: 'scan-oportunidades', desc: 'Escanear oportunidades crypto' },
    { name: 'ejecutar-arbitraje', desc: 'Ejecutar arbitraje crypto' },
    { name: 'pnl', desc: 'Ver P&L crypto' },
    { name: 'crear-preferencia-mp', desc: 'Crear preferencia MercadoPago' },
    { name: 'dashboard', desc: 'Ver métricas del módulo' },
  ],
};

let eventCount = 0;
let pollInterval;
let demoUptime = 0;

// === DEMO DATA ===
const DEMO_MODULES = {
  gastronomia: { status: 'running', manifest: { name: 'Gastronomía OnBox', commands: ['listar-pedidos','nuevo-pedido','estado-cocina','asignar-delivery','menu-del-dia','reservar-mesa','carta-qr','dashboard'] } },
  logistica: { status: 'running', manifest: { name: 'Logística & Delivery', commands: ['asignar-envio','tracking','listar-drivers','optimizar-rutas','scan-paquete','dashboard'] } },
  'onbox-market': { status: 'running', manifest: { name: 'Onbox Marketplace', commands: ['listar-productos','publicar-ml','sync-stock','importar-ordenes','sync-shopify','sync-tiendanube','dashboard'] } },
  retail: { status: 'running', manifest: { name: 'Retail & Inventario', commands: ['consultar-stock','entrada-mercaderia','ajuste-inventario','alerta-stock-bajo','reporte-valorizado','dashboard'] } },
  sistemas: { status: 'running', manifest: { name: 'Sistemas & DevOps', commands: ['health-check','deploy-preview','deploy-produccion','listar-workers','logs','dashboard'] } },
  financiera: { status: 'running', manifest: { name: 'Financiera & Crypto', commands: ['emitir-factura','consultar-ultimo-cbte','calcular-iva','scan-oportunidades','ejecutar-arbitraje','pnl','crear-preferencia-mp','dashboard'] } },
};

const DEMO_EVENTS = [
  { type: 'selenia.boot', payload: { version: '0.2.1' }, meta: { timestamp: Date.now() - 60000 } },
  { type: 'module.registered', payload: { id: 'gastronomia' }, meta: { timestamp: Date.now() - 55000 } },
  { type: 'module.registered', payload: { id: 'logistica' }, meta: { timestamp: Date.now() - 54000 } },
  { type: 'module.registered', payload: { id: 'onbox-market' }, meta: { timestamp: Date.now() - 53000 } },
  { type: 'module.registered', payload: { id: 'retail' }, meta: { timestamp: Date.now() - 52000 } },
  { type: 'module.registered', payload: { id: 'sistemas' }, meta: { timestamp: Date.now() - 51000 } },
  { type: 'module.registered', payload: { id: 'financiera' }, meta: { timestamp: Date.now() - 50000 } },
  { type: 'gateway.ready', payload: { port: 4000, routes: 9 }, meta: { timestamp: Date.now() - 49000 } },
  { type: 'selenia.ready', payload: { modules: 6, flows: 4, tools: 7 }, meta: { timestamp: Date.now() - 48000 } },
  { type: 'monitor.check', payload: { healthy: 6, total: 6 }, meta: { timestamp: Date.now() - 30000 } },
];

const DEMO_AI_RESPONSES = [
  '¡Hola! Soy **Selenia**, tu asistente de IA. Controlo 6 módulos de negocio del ecosistema OnBox.\n\nPuedo ayudarte con:\n- 🍕 Gestión de pedidos\n- 📦 Logística y envíos\n- 🛒 Marketplace multi-canal\n- 🏪 Inventario y stock\n- ⚙️ DevOps y workers\n- 💰 Facturación AFIP y crypto',
  'El sistema tiene **6 módulos activos**, todos running. El Event Bus está procesando eventos normalmente y los 8 conectores están operativos.',
  'Para ejecutar un comando, hacé clic en cualquier módulo y elegí la acción. Yo me encargo de orquestar todo automáticamente.',
  'El flujo `pedido-completo` ejecuta: gastronomia → logistica → financiera. Ideal para un pedido de delivery completo con facturación.',
];
let demoAiIndex = 0;

// === FETCH HELPERS ===
async function api(path, opts = {}) {
  if (DEMO_MODE) {
    if (path === '/health') return { uptime: demoUptime, modules: DEMO_MODULES };
    if (path === '/events/stats') return { historySize: DEMO_EVENTS.length };
    if (path === '/events/history') return DEMO_EVENTS;
    if (path.startsWith('/ai/chat')) {
      let hint = '';
      try {
        const b = opts.body ? JSON.parse(opts.body) : {};
        const msgs = Array.isArray(b.messages) ? b.messages : [];
        const lastU = [...msgs].reverse().find((m) => m.role === 'user');
        hint = (lastU && lastU.content) || b.message || '';
      } catch (_) {}
      const resp = hint.length > 80
        ? '**Demo** — En prod esto va a Claude con council y memoria de chat.\n\n' + DEMO_AI_RESPONSES[demoAiIndex % DEMO_AI_RESPONSES.length]
        : DEMO_AI_RESPONSES[demoAiIndex % DEMO_AI_RESPONSES.length];
      demoAiIndex++;
      return { message: resp };
    }
    if (path.includes('/command')) return { ok: true, result: 'Comando ejecutado (demo mode)' };
    if (path === '/connectors/health') return { status: 'demo' };
    return {};
  }
  const res = await fetch(`${API}${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const ct = res.headers.get('content-type') || '';
  const data = ct.includes('application/json') ? await res.json() : await res.text();
  if (!res.ok) {
    const detail = typeof data === 'object' && data && data.error ? data.error : `HTTP ${res.status}`;
    throw new Error(detail);
  }
  return data;
}

// === INIT ===
async function init() {
  renderChatFromTranscript();
  try {
    await refreshStatus();
    await refreshEvents();
    pollInterval = setInterval(async () => {
      if (DEMO_MODE) demoUptime += 3;
      await refreshStatus();
      await refreshEvents();
    }, 3000);
    document.getElementById('statusDot').style.background = 'var(--green)';
    document.getElementById('statusText').textContent = DEMO_MODE ? 'Demo Mode' : 'Conectado';
  } catch (e) {
    // API not available — switch to demo mode
    DEMO_MODE = true;
    demoUptime = 42;
    document.getElementById('statusDot').style.background = 'var(--orange)';
    document.getElementById('statusText').textContent = 'Demo Mode';
    await refreshStatus();
    await refreshEvents();
    pollInterval = setInterval(async () => {
      demoUptime += 3;
      // Add random demo events
      if (Math.random() > 0.5) {
        const types = ['monitor.check', 'module.heartbeat', 'event.processed', 'selenia.insight'];
        const mods = ['gastronomia', 'logistica', 'onbox-market', 'retail', 'sistemas', 'financiera'];
        DEMO_EVENTS.push({
          type: types[Math.floor(Math.random() * types.length)],
          payload: { module: mods[Math.floor(Math.random() * mods.length)] },
          meta: { timestamp: Date.now() }
        });
      }
      await refreshStatus();
      await refreshEvents();
    }, 3000);
  }
}

// === REFRESH STATUS ===
async function refreshStatus() {
  const health = await api('/health');
  const stats = await api('/events/stats');

  // Uptime
  const secs = Math.floor(health.uptime);
  const h = String(Math.floor(secs / 3600)).padStart(2, '0');
  const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
  const s = String(secs % 60).padStart(2, '0');
  document.getElementById('uptimeText').textContent = `${h}:${m}:${s}`;

  // Metrics
  const mods = health.modules || {};
  const running = Object.values(mods).filter(v => v.status === 'running').length;
  document.getElementById('metricModules').textContent = running;
  document.getElementById('metricEvents').textContent = stats.historySize || 0;
  document.getElementById('metricRequests').textContent = '-';
  document.getElementById('metricErrors').textContent =
    Object.values(mods).filter(v => v.status === 'error').length;

  // Module cards
  renderModules(mods);
}

// === RENDER MODULES ===
function renderModules(mods) {
  const grid = document.getElementById('modulesGrid');
  grid.innerHTML = '';

  for (const [id, data] of Object.entries(mods)) {
    const meta = MODULE_META[id] || { icon: '📋', color: '#888', desc: id };
    const card = document.createElement('div');
    card.className = 'mod-card';
    card.dataset.module = id;
    card.onclick = () => openModule(id, data);

    const statusClass = data.status === 'running' ? 'running' : data.status === 'error' ? 'error' : 'booting';

    card.innerHTML = `
      <div class="mod-header">
        <span class="mod-icon">${meta.icon}</span>
        <span class="mod-status ${statusClass}">${data.status}</span>
      </div>
      <div class="mod-name">${data.manifest?.name || id}</div>
      <div class="mod-desc">${meta.desc}</div>
      <div class="mod-stats">
        <div class="mod-stat">Cmds: <span class="num">${data.manifest?.commands?.length || 0}</span></div>
      </div>
    `;
    grid.appendChild(card);
  }
}

// === REFRESH EVENTS ===
async function refreshEvents() {
  const history = await api('/events/history');
  const stream = document.getElementById('eventStream');

  if (!history || history.length === 0) {
    stream.innerHTML = '<div style="color:var(--text2);text-align:center;padding:20px">Sin eventos todavía</div>';
    return;
  }

  const latest = history.slice(-30).reverse();
  eventCount = history.length;
  document.getElementById('metricEvents').textContent = eventCount;

  stream.innerHTML = latest.map(ev => {
    const t = new Date(ev.meta?.timestamp || Date.now());
    const time = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
    const color = ev.type.includes('error') ? 'var(--red)' :
                  ev.type.includes('selenia') ? 'var(--accent2)' :
                  ev.type.includes('gateway') ? 'var(--cyan)' : 'var(--green)';
    const payload = JSON.stringify(ev.payload || {}).slice(0, 80);
    return `
      <div class="event-item">
        <div class="event-dot" style="background:${color}"></div>
        <span class="event-time">${time}</span>
        <span class="event-type">${ev.type}</span>
        <span class="event-payload">${payload}</span>
      </div>
    `;
  }).join('');
}

// === OPEN MODULE DETAIL ===
function openModule(moduleId, data) {
  const meta = MODULE_META[moduleId] || {};
  const modal = document.getElementById('moduleModal');
  document.getElementById('modalTitle').textContent = `${meta.icon || ''} ${data.manifest?.name || moduleId}`;

  const cmds = COMMANDS[moduleId] || [];
  document.getElementById('modalContent').innerHTML = `
    <p style="color:var(--text2);margin-bottom:16px;font-size:13px">${meta.desc || ''}</p>
    <div style="margin-bottom:16px;font-size:13px">
      <strong>Estado:</strong> ${data.status} &nbsp;|&nbsp;
      <strong>Comandos:</strong> ${cmds.length}
    </div>
    <div class="section-title" style="margin-top:16px">Comandos disponibles</div>
    <div class="cmd-list">
      ${cmds.map(c => `
        <div class="cmd-item" onclick="runCommand('${moduleId}', '${c.name}')">
          <div class="cmd-name">${c.name}</div>
          <div class="cmd-desc">${c.desc}</div>
        </div>
      `).join('')}
    </div>
    <div id="cmdResult" style="margin-top:16px"></div>
  `;
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('moduleModal').classList.remove('active');
}
document.getElementById('moduleModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

// === RUN COMMAND ===
async function runCommand(moduleId, action) {
  const resultDiv = document.getElementById('cmdResult');
  resultDiv.innerHTML = '<span class="loading">Ejecutando</span>';
  try {
    const result = await api(`/modules/${moduleId}/command`, {
      method: 'POST',
      body: JSON.stringify({ action, payload: {} }),
    });
    resultDiv.innerHTML = `
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:8px">
        <div style="font-size:11px;color:var(--green);margin-bottom:6px;font-weight:700">✓ Respuesta</div>
        <pre style="font-size:12px;color:var(--text);white-space:pre-wrap;font-family:Consolas,monospace">${JSON.stringify(result, null, 2)}</pre>
      </div>
    `;
    refreshEvents();
  } catch (e) {
    resultDiv.innerHTML = `<div style="color:var(--red);font-size:13px">✗ Error: ${e.message}</div>`;
  }
}

// === CHAT ===
function renderChatFromTranscript() {
  const msgs = document.getElementById('chatMessages');
  const lines = [
    '<div class="chat-msg system">Selenia lista. Cambios riesgosos: confirmá con <strong>APROBADO_SELENIA</strong> cuando la IA lo pida.</div>',
  ];
  for (const m of chatTranscript) {
    if (m.role === 'user') lines.push(`<div class="chat-msg user">${escapeHtml(m.content)}</div>`);
    else lines.push(`<div class="chat-msg ai"><div class="sender">Selenia</div>${formatAiResponse(m.content)}</div>`);
  }
  msgs.innerHTML = lines.join('');
  msgs.scrollTop = msgs.scrollHeight;
}

function resetChat() {
  chatTranscript = [];
  renderChatFromTranscript();
}

document.getElementById('newChatBtn').addEventListener('click', resetChat);

async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  chatTranscript.push({ role: 'user', content: msg });
  renderChatFromTranscript();

  const msgs = document.getElementById('chatMessages');
  const loadId = 'load-' + Date.now();
  msgs.innerHTML += `<div class="chat-msg ai" id="${loadId}"><div class="sender">Selenia</div><span class="loading">Pensando</span></div>`;
  msgs.scrollTop = msgs.scrollHeight;

  document.getElementById('chatSend').disabled = true;

  const councilLite = document.getElementById('councilLite').checked;

  try {
    const payload = { messages: chatTranscript, councilLite };
    const dk = (document.getElementById('dispatchKeyInput') && document.getElementById('dispatchKeyInput').value || '').trim();
    if (dk) payload.dispatchKey = dk;
    const result = await api('/ai/chat', {
      method: 'POST',
      body: JSON.stringify(payload),
    });
    const text = result.message || JSON.stringify(result);
    chatTranscript.push({ role: 'assistant', content: text });
    const el = document.getElementById(loadId);
    if (el) el.remove();
    renderChatFromTranscript();
    if (result.githubDispatch) {
      const box = document.getElementById('chatMessages');
      const g = result.githubDispatch;
      let line = '';
      if (g.ok) line = `GitHub: disparado repository_dispatch <code>${escapeHtml(g.event_type || '')}</code> en <code>${escapeHtml(g.repo || '')}</code>.`;
      else if (g.skipped) line = `GitHub dispatch omitido: ${escapeHtml(g.reason || '')}`;
      else line = `GitHub dispatch error ${escapeHtml(String(g.httpStatus || ''))}: ${escapeHtml((g.detail || '').slice(0, 280))}`;
      box.innerHTML += `<div class="chat-msg system">${line}</div>`;
      box.scrollTop = box.scrollHeight;
    }
  } catch (e) {
    chatTranscript.pop();
    const el = document.getElementById(loadId);
    if (el) el.remove();
    renderChatFromTranscript();
    const box = document.getElementById('chatMessages');
    box.innerHTML += `<div class="chat-msg ai"><div class="sender">Selenia</div><span style="color:var(--red)">Error: ${escapeHtml(e.message)}. Corré \`npm start\` o \`npm run cf:dev\` y configurá ANTHROPIC_API_KEY (ver .env.example / wrangler secret).</span></div>`;
    box.scrollTop = box.scrollHeight;
  }

  document.getElementById('chatSend').disabled = false;
  msgs.scrollTop = msgs.scrollHeight;
}

function formatAiResponse(text) {
  return text
    .replace(/\n/g, '<br>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.*?)`/g, '<code style="background:rgba(0,28,44,0.85);padding:2px 6px;border:1px solid rgba(0,229,255,0.2);font-size:12px;font-family:Share Tech Mono,monospace">$1</code>');
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// === KEYBOARD ===
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// === START ===
init();
</script>
