<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selenia — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Inter:ital,opsz,wght@0,14..32,400..600;1,14..32,400..500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0e12;
    --bg2: #12151c;
    --bg3: #181c26;
    --surface: #141820;
    --surface-hover: #1a1f2a;
    --border: #2a303c;
    --border-bright: #3d4654;
    --text: #e8eaef;
    --text2: #8b95a8;
    --hud: #3b82f6;
    --hud-dim: #64748b;
    --accent: #2563eb;
    --accent2: #60a5fa;
    --reactor: #f97316;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #eab308;
    --blue: #38bdf8;
    --pink: #ec4899;
    --cyan: #22d3ee;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 4px 24px rgba(0, 0, 0, 0.4);
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: var(--font-sans);
    font-weight: 450;
    font-size: 14px;
    background: var(--bg);
    background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59, 130, 246, 0.06), transparent);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* === HEADER === */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 22px;
    background: rgba(12, 14, 18, 0.92);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 40px; height: 40px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-sans);
    font-weight: 600; font-size: 16px; color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .logo::after { display: none; }
  .logo--sm { width: 30px; height: 30px; font-size: 13px; }
  .header-title-wrap { display: flex; flex-direction: column; gap: 2px; }
  .header-title-wrap h1 {
    font-family: var(--font-sans);
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .hud-subline {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    text-transform: none;
    color: var(--text2);
    font-weight: 400;
  }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.65; }
  }
  .status-text {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .uptime {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text2);
    padding: 6px 11px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-sm);
  }

  /* === LAYOUT === */
  .main {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 0;
    min-height: calc(100vh - 65px);
  }
  .content { padding: 22px 24px; overflow-y: auto; }
  .sidebar {
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
  }

  /* === METRICS === */
  .metrics-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }
  .metric-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 12px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s, background 0.2s;
  }
  .metric-card::before { display: none; }
  .metric-card:hover { border-color: var(--border-bright); background: var(--surface-hover); }
  .metric-card .value {
    font-family: var(--font-sans);
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .metric-card .label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 6px;
    font-weight: 500;
  }

  /* === MODULES === */
  .section-title {
    font-family: var(--font-sans);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text2);
    margin-bottom: 12px;
    font-weight: 600;
    padding-left: 10px;
    border-left: 2px solid var(--hud);
  }
  .modules-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }
  .mod-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .mod-card:hover {
    border-color: var(--border-bright);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .mod-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0; width: 3px;
    border-radius: var(--radius) 0 0 var(--radius);
  }
  .mod-card[data-module="gastronomia"]::before { background: var(--orange); }
  .mod-card[data-module="logistica"]::before { background: var(--blue); }
  .mod-card[data-module="onbox-market"]::before { background: var(--green); }
  .mod-card[data-module="retail"]::before { background: var(--pink); }
  .mod-card[data-module="sistemas"]::before { background: var(--cyan); }
  .mod-card[data-module="financiera"]::before { background: var(--accent2); }
  .mod-card .mod-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .mod-card .mod-icon { font-size: 24px; opacity: 0.95; }
  .mod-card .mod-status {
    font-family: var(--font-mono);
    font-size: 10px; padding: 4px 8px;
    border-radius: 999px;
    text-transform: uppercase; font-weight: 500; letter-spacing: 0.04em;
  }
  .mod-status.running { background: rgba(34, 197, 94, 0.12); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.35); }
  .mod-status.error { background: rgba(239, 68, 68, 0.1); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.35); }
  .mod-status.booting { background: rgba(234, 179, 8, 0.12); color: var(--orange); border: 1px solid rgba(234, 179, 8, 0.35); }
  .mod-card .mod-name { font-family: var(--font-sans); font-size: 14px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 4px; color: var(--text); }
  .mod-card .mod-desc { font-size: 13px; color: var(--text2); margin-bottom: 12px; line-height: 1.45; }
  .mod-card .mod-stats { display: flex; gap: 12px; }
  .mod-card .mod-stat { font-family: var(--font-mono); font-size: 10px; color: var(--text2); display: flex; align-items: center; gap: 4px; }
  .mod-card .mod-stat .num { color: var(--text); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }

  /* === EVENTS === */
  .event-stream {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    max-height: 320px;
    overflow-y: auto;
    box-shadow: var(--shadow-sm);
  }
  .event-stream::-webkit-scrollbar { width: 6px; }
  .event-stream::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
  .event-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(42, 48, 60, 0.6);
    font-size: 12px;
    font-family: var(--font-mono);
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .event-item:last-child { border-bottom: none; }
  .event-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .event-time { color: var(--hud-dim); flex-shrink: 0; font-size: 11px; }
  .event-type { color: var(--accent2); font-weight: 600; font-family: var(--font-sans); font-size: 12px; }
  .event-payload { color: var(--text2); word-break: break-all; font-size: 11px; line-height: 1.4; }

  /* === CHAT === */
  .chat-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
    font-size: 13px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    background: var(--bg3);
  }
  .chat-messages { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
  .chat-msg {
    max-width: 92%;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    animation: fadeIn 0.25s ease;
  }
  .chat-msg.user {
    align-self: flex-end;
    background: var(--accent);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #fff;
  }
  .chat-msg.ai {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .chat-msg.ai .sender {
    font-family: var(--font-mono);
    font-size: 10px; color: var(--text2); font-weight: 500; margin-bottom: 6px;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .chat-msg.system {
    align-self: center;
    background: var(--bg3);
    border: 1px dashed var(--border);
    color: var(--text2);
    font-size: 12px;
    font-family: var(--font-mono);
    text-align: center;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
  }
  .chat-input-area {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    display: flex; gap: 10px;
    background: var(--bg2);
  }
  .chat-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--font-sans);
    outline: none;
    resize: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .chat-input:focus { border-color: var(--hud); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
  .chat-input::placeholder { color: var(--text2); opacity: 0.85; }
  .chat-send {
    background: var(--accent);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-sm);
    width: 44px;
    cursor: pointer;
    color: #fff;
    font-size: 16px;
    font-family: var(--font-sans);
    font-weight: 600;
    transition: background 0.15s, opacity 0.15s;
  }
  .chat-send:hover { background: #1d4ed8; }
  .chat-send:disabled { opacity: 0.45; cursor: not-allowed; }

  /* === MODAL === */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(6, 8, 12, 0.72);
    backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    z-index: 200;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: min(600px, 94vw); max-height: 82vh;
    overflow-y: auto; padding: 22px;
    box-shadow: var(--shadow-md);
  }
  .modal h2 { font-family: var(--font-sans); font-size: 1rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 12px; color: var(--text); }
  .modal .close {
    float: right;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text2);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 16px;
    width: 32px; height: 32px;
    line-height: 28px;
    transition: background 0.15s, color 0.15s;
  }
  .modal .close:hover { background: var(--surface-hover); color: var(--text); }
  .modal .cmd-list { display: flex; flex-direction: column; gap: 8px; }
  .modal .cmd-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .modal .cmd-item:hover { border-color: var(--border-bright); background: var(--surface-hover); }
  .modal .cmd-name { font-family: var(--font-mono); font-weight: 500; font-size: 12px; color: var(--accent2); letter-spacing: 0.02em; }
  .modal .cmd-desc { font-size: 13px; color: var(--text2); margin-top: 4px; line-height: 1.4; }

  @media (max-width: 1100px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { min-height: 400px; border-left: none; border-top: 1px solid var(--border); }
    .modules-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .modules-grid { grid-template-columns: 1fr; }
    .metrics-bar { grid-template-columns: repeat(2, 1fr); }
    .header-title-wrap h1 { font-size: 0.92rem; }
  }

  .loading { display: inline-block; }
  .loading::after {
    content: ''; display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--border-bright);
    border-top-color: var(--hud);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-left: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hud-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 6px 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-weight: 500;
    transition: border-color 0.15s, background 0.15s;
  }
  .hud-btn:hover { border-color: var(--border-bright); background: var(--surface-hover); }
  .hud-label { font-family: var(--font-mono); font-size: 11px; color: var(--text2); letter-spacing: 0.02em; }
  .hud-input {
    width: 100%;
    margin-top: 4px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 12px;
    font-family: var(--font-mono);
    border-radius: var(--radius-sm);
  }
  .hud-input:focus { outline: none; border-color: var(--hud); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.18); }
  .hud-sidebar-title {
    font-family: var(--font-sans);
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--text);
    font-weight: 600;
    text-transform: none;
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <div class="logo">S</div>
    <div class="header-title-wrap">
      <h1>Selenia</h1>
      <span class="hud-subline">OnBox · consola de operaciones</span>
    </div>
  </div>
  <div class="header-right">
    <div style="display:flex;align-items:center;gap:6px">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Conectando...</span>
    </div>
    <span class="uptime" id="uptimeText">--:--:--</span>
  </div>
</header>

<!-- MAIN -->
<div class="main">
  <!-- LEFT: CONTENT -->
  <div class="content">
    <!-- Metrics -->
    <div class="metrics-bar">
      <div class="metric-card">
        <div class="value" id="metricModules">-</div>
        <div class="label">Módulos activos</div>
      </div>
      <div class="metric-card">
        <div class="value" id="metricEvents">-</div>
        <div class="label">Eventos hoy</div>
      </div>
      <div class="metric-card">
        <div class="value" id="metricRequests">-</div>
        <div class="label">Requests</div>
      </div>
      <div class="metric-card">
        <div class="value" id="metricErrors">-</div>
        <div class="label">Errores</div>
      </div>
    </div>

    <!-- Modules -->
    <div class="section-title">Módulos de negocio</div>
    <div class="modules-grid" id="modulesGrid"></div>

    <!-- Events -->
    <div class="section-title">Event Stream (en vivo)</div>
    <div class="event-stream" id="eventStream">
      <div style="color:var(--text2);text-align:center;padding:20px">Cargando eventos...</div>
    </div>
  </div>

  <!-- RIGHT: CHAT SIDEBAR -->
  <div class="sidebar">
    <div class="chat-header" style="flex-wrap:wrap;gap:10px">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <div class="logo logo--sm">S</div>
        <span class="hud-sidebar-title">Asistente</span>
      </div>
      <label class="hud-label" style="display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap">
        <input type="checkbox" id="councilLite" checked /> Council
      </label>
      <button type="button" class="hud-btn" id="newChatBtn">Nuevo chat</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div style="padding:0 14px 10px">
      <label class="hud-label" for="dispatchKeyInput">Dispatch key (opcional)</label>
      <input type="password" class="hud-input" id="dispatchKeyInput" autocomplete="off" placeholder="SELENIA_DISPATCH_KEY en Worker" />
    </div>
    <div class="chat-input-area">
      <textarea class="chat-input" id="chatInput" rows="1" placeholder="Escribí tu mensaje..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
      <button class="chat-send" id="chatSend" onclick="sendChat()">→</button>
    </div>
  </div>
</div>

<!-- MODULE DETAIL MODAL -->
<div class="modal-overlay" id="moduleModal">
  <div class="modal">
    <button class="close" onclick="closeModal()">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const API = window.location.origin;
let DEMO_MODE = false;
/** Historial Anthropic (user o assistant); no se guarda en servidor = $0 KV. */
let chatTranscript = [];
const MODULE_META = {
  gastronomia: { icon: '🍕', color: '#fdcb6e', desc: 'Pedidos, delivery, cocina, app clientes' },
  logistica: { icon: '🚚', color: '#74b9ff', desc: 'Rutas, drivers, zonas, tracking, scanner' },
  'onbox-market': { icon: '🛒', color: '#00b894', desc: 'Marketplace B2C/B2B, ML, Shopify, TN' },
  retail: { icon: '📦', color: '#fd79a8', desc: 'Inventario FIFO, stock, precios, lotes' },
  sistemas: { icon: '⚙️', color: '#81ecec', desc: 'Infra, workers, APIs, monitoring, deploys' },
  financiera: { icon: '💰', color: '#a29bfe', desc: 'AFIP, impuestos, crypto, pagos, cobranzas' },
};

const COMMANDS = {
  gastronomia: [
    { name: 'crear-pedido', desc: 'Crear nuevo pedido gastronómico' },
    { name: 'cambiar-estado-pedido', desc: 'Cambiar estado de un pedido' },
    { name: 'asignar-repartidor', desc: 'Asignar repartidor a pedido' },
    { name: 'dashboard', desc: 'Ver métricas del módulo' },
  ],
  logistica: [
    { name: 'crear-envio', desc: 'Crear nuevo envío' },
    { name: 'asignar-driver', desc: 'Asignar driver a envío' },
    { name: 'confirmar-entrega', desc: 'Confirmar entrega completada' },
    { name: 'escanear-etiqueta', desc: 'Escanear etiqueta de paquete' },
    { name: 'optimizar-rutas', desc: 'Optimizar rutas de zona' },
    { name: 'dashboard', desc: 'Ver métricas del módulo' },
  ],
  'onbox-market': [
    { name: 'listar-catalogo', desc: 'Listar catálogo de productos' },
    { name: 'checkout', desc: 'Procesar checkout de orden' },
    { name: 'sync-mercadolibre', desc: 'Sincronizar con MercadoLibre' },
    { name: 'sync-shopify', desc: 'Sincronizar con Shopify' },
    { name: 'sync-tiendanube', desc: 'Sincronizar con TiendaNube' },
    { name: 'match-b2b', desc: 'Match B2B oferta/demanda' },
    { name: 'dashboard', desc: 'Ver métricas del módulo' },
  ],
  retail: [
    { name: 'consultar-stock', desc: 'Consultar stock de producto' },
    { name: 'ingreso-stock', desc: 'Ingresar stock' },
    { name: 'deducir-stock', desc: 'Deducir stock (FIFO)' },
    { name: 'actualizar-precio', desc: 'Actualizar precio de producto' },

// === DEMO DATA ===
const DEMO_MODULES = {

  logistica: { status: 'running', manifest: { name: 'Logística & Delivery', commands: ['asignar-envio','tracking','listar-drivers','optimizar-rutas','scan-paquete','dashboard'] } },
  'onbox-market': { status: 'running', manifest: { name: 'Onbox Marketplace', commands: ['listar-productos','publicar-ml','sync-stock','importar-ordenes','sync-shopify','sync-tiendanube','dashboard'] } },
  retail: { status: 'running', manifest: { name: 'Retail & Inventario', commands: ['consultar-stock','entrada-mercaderia','ajuste-inventario','alerta-stock-bajo','reporte-valorizado','dashboard'] } },

const DEMO_EVENTS = [
  { type: 'selenia.boot', payload: { version: '0.2.1' }, meta: { timestamp: Date.now() - 60000 } },

  { type: 'module.registered', payload: { id: 'retail' }, meta: { timestamp: Date.now() - 52000 } },

const DEMO_AI_RESPONSES = [
  '¡Hola! Soy **Selenia**, tu asistente de IA. Controlo 6 módulos de negocio del ecosistema OnBox.\n\nPuedo ayudarte con:\n- 🍕 Gestión de pedidos\n- 📦 Logística y envíos\n- 🛒 Marketplace multi-canal\n- 🏪 Inventario y stock\n- ⚙️ DevOps y workers\n- 💰 Facturación AFIP y crypto',
  'El sistema tiene **6 módulos activos**, todos running. El Event Bus está procesando eventos normalmente y los 8 conectores están operativos.',

  'El flujo `pedido-completo` ejecuta: gastronomia → logistica → financiera. Ideal para un pedido de delivery completo con facturación.',
];
let demoAiIndex = 0;

// === FETCH HELPERS ===
async function api(path, opts = {}) {
  if (DEMO_MODE) {
    if (path === '/health') return { uptime: demoUptime, modules: DEMO_MODULES };
    if (path === '/events/stats') return { historySize: DEMO_EVENTS.length };
    if (path === '/events/history') return DEMO_EVENTS;
    if (path.startsWith('/ai/chat')) {
      let hint = '';
      try {
        const b = opts.body ? JSON.parse(opts.body) : {};
        const msgs = Array.isArray(b.messages) ? b.messages : [];
        const lastU = [...msgs].reverse().find((m) => m.role === 'user');
        hint = (lastU && lastU.content) || b.message || '';
      } catch (_) {}
      const resp = hint.length > 80
        ? '**Demo** — En prod esto va a Claude con council y memoria de chat.\n\n' + DEMO_AI_RESPONSES[demoAiIndex % DEMO_AI_RESPONSES.length]
        : DEMO_AI_RESPONSES[demoAiIndex % DEMO_AI_RESPONSES.length];
      demoAiIndex++;
      return { message: resp };
    }
    if (path.includes('/command')) return { ok: true, result: 'Comando ejecutado (demo mode)' };
    if (path === '/connectors/health') return { status: 'demo' };
    return {};
  }
  const res = await fetch(`${API}${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const ct = res.headers.get('content-type') || '';
  const data = ct.includes('application/json') ? await res.json() : await res.text();
  if (!res.ok) {
    const detail = typeof data === 'object' && data && data.error ? data.error : `HTTP ${res.status}`;
    throw new Error(detail);
  }
  return data;
}

// === INIT ===
async function init() {
  renderChatFromTranscript();
  try {
    await refreshStatus();
    await refreshEvents();
    pollInterval = setInterval(async () => {
      if (DEMO_MODE) demoUptime += 3;
      await refreshStatus();
      await refreshEvents();
    }, 3000);
    document.getElementById('statusDot').style.background = 'var(--green)';
    document.getElementById('statusText').textContent = DEMO_MODE ? 'Demo Mode' : 'Conectado';
  } catch (e) {
    // API not available — switch to demo mode
    DEMO_MODE = true;
    demoUptime = 42;
    document.getElementById('statusDot').style.background = 'var(--orange)';
    document.getElementById('statusText').textContent = 'Demo Mode';
    await refreshStatus();
    await refreshEvents();
    pollInterval = setInterval(async () => {
      demoUptime += 3;
      // Add random demo events
      if (Math.random() > 0.5) {
        const types = ['monitor.check', 'module.heartbeat', 'event.processed', 'selenia.insight'];
        const mods = ['gastronomia', 'logistica', 'onbox-market', 'retail', 'sistemas', 'financiera'];
        DEMO_EVENTS.push({
          type: types[Math.floor(Math.random() * types.length)],
          payload: { module: mods[Math.floor(Math.random() * mods.length)] },
          meta: { timestamp: Date.now() }
        });
      }
      await refreshStatus();
      await refreshEvents();
    }, 3000);
  }
}

// === REFRESH STATUS ===
async function refreshStatus() {
  const health = await api('/health');
  const stats = await api('/events/stats');

  // Uptime
  const secs = Math.floor(health.uptime);
  const h = String(Math.floor(secs / 3600)).padStart(2, '0');
  const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
  const s = String(secs % 60).padStart(2, '0');
  document.getElementById('uptimeText').textContent = `${h}:${m}:${s}`;

  // Metrics
  const mods = health.modules || {};
  const running = Object.values(mods).filter(v => v.status === 'running').length;
  document.getElementById('metricModules').textContent = running;
  document.getElementById('metricEvents').textContent = stats.historySize || 0;
  document.getElementById('metricRequests').textContent = '-';
  document.getElementById('metricErrors').textContent =
    Object.values(mods).filter(v => v.status === 'error').length;

  // Module cards
  renderModules(mods);
}

// === RENDER MODULES ===
function renderModules(mods) {
  const grid = document.getElementById('modulesGrid');
  grid.innerHTML = '';

  for (const [id, data] of Object.entries(mods)) {
    const meta = MODULE_META[id] || { icon: '📋', color: '#888', desc: id };
    const card = document.createElement('div');
    card.className = 'mod-card';
    card.dataset.module = id;
    card.onclick = () => openModule(id, data);

    const statusClass = data.status === 'running' ? 'running' : data.status === 'error' ? 'error' : 'booting';

    card.innerHTML = `
      <div class="mod-header">
        <span class="mod-icon">${meta.icon}</span>
        <span class="mod-status ${statusClass}">${data.status}</span>
      </div>
      <div class="mod-name">${data.manifest?.name || id}</div>
      <div class="mod-desc">${meta.desc}</div>
      <div class="mod-stats">
        <div class="mod-stat">Cmds: <span class="num">${data.manifest?.commands?.length || 0}</span></div>
      </div>
    `;
    grid.appendChild(card);
  }
}

// === REFRESH EVENTS ===
async function refreshEvents() {
  const history = await api('/events/history');
  const stream = document.getElementById('eventStream');

  if (!history || history.length === 0) {
    stream.innerHTML = '<div style="color:var(--text2);text-align:center;padding:20px">Sin eventos todavía</div>';
    return;
  }

  const latest = history.slice(-30).reverse();
  eventCount = history.length;
  document.getElementById('metricEvents').textContent = eventCount;

  stream.innerHTML = latest.map(ev => {
    const t = new Date(ev.meta?.timestamp || Date.now());
    const time = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
    const color = ev.type.includes('error') ? 'var(--red)' :
                  ev.type.includes('selenia') ? 'var(--accent2)' :
                  ev.type.includes('gateway') ? 'var(--cyan)' : 'var(--green)';
    const payload = JSON.stringify(ev.payload || {}).slice(0, 80);
    return `
      <div class="event-item">
        <div class="event-dot" style="background:${color}"></div>
        <span class="event-time">${time}</span>
        <span class="event-type">${ev.type}</span>
        <span class="event-payload">${payload}</span>
      </div>
    `;
  }).join('');
}

// === OPEN MODULE DETAIL ===
function openModule(moduleId, data) {
  const meta = MODULE_META[moduleId] || {};
  const modal = document.getElementById('moduleModal');
  document.getElementById('modalTitle').textContent = `${meta.icon || ''} ${data.manifest?.name || moduleId}`;

  const cmds = COMMANDS[moduleId] || [];
  document.getElementById('modalContent').innerHTML = `
    <p style="color:var(--text2);margin-bottom:16px;font-size:13px">${meta.desc || ''}</p>
    <div style="margin-bottom:16px;font-size:13px">
      <strong>Estado:</strong> ${data.status} &nbsp;|&nbsp;
      <strong>Comandos:</strong> ${cmds.length}
    </div>
    <div class="section-title" style="margin-top:16px">Comandos disponibles</div>
    <div class="cmd-list">
      ${cmds.map(c => `
        <div class="cmd-item" onclick="runCommand('${moduleId}', '${c.name}')">
          <div class="cmd-name">${c.name}</div>
          <div class="cmd-desc">${c.desc}</div>
        </div>
      `).join('')}
    </div>
    <div id="cmdResult" style="margin-top:16px"></div>
  `;
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('moduleModal').classList.remove('active');
}
document.getElementById('moduleModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

// === RUN COMMAND ===
async function runCommand(moduleId, action) {
  const resultDiv = document.getElementById('cmdResult');
  resultDiv.innerHTML = '<span class="loading">Ejecutando</span>';
  try {
    const result = await api(`/modules/${moduleId}/command`, {
      method: 'POST',
      body: JSON.stringify({ action, payload: {} }),
    });
    resultDiv.innerHTML = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:8px">
        <div style="font-size:11px;color:var(--green);margin-bottom:6px;font-weight:600">Respuesta</div>
        <pre style="font-size:12px;color:var(--text);white-space:pre-wrap;font-family:var(--font-mono),monospace">${JSON.stringify(result, null, 2)}</pre>
      </div>
    `;
    refreshEvents();
  } catch (e) {
    resultDiv.innerHTML = `<div style="color:var(--red);font-size:13px">✗ Error: ${e.message}</div>`;
  }
}

// === CHAT ===
function renderChatFromTranscript() {
  const msgs = document.getElementById('chatMessages');
  const lines = [
    '<div class="chat-msg system">Selenia lista. Cambios riesgosos: confirmá con <strong>APROBADO_SELENIA</strong> cuando la IA lo pida.</div>',
  ];
  for (const m of chatTranscript) {
    if (m.role === 'user') lines.push(`<div class="chat-msg user">${escapeHtml(m.content)}</div>`);
    else lines.push(`<div class="chat-msg ai"><div class="sender">Selenia</div>${formatAiResponse(m.content)}</div>`);
  }
  msgs.innerHTML = lines.join('');
  msgs.scrollTop = msgs.scrollHeight;
}

function resetChat() {
  chatTranscript = [];
  renderChatFromTranscript();
}

document.getElementById('newChatBtn').addEventListener('click', resetChat);

async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  chatTranscript.push({ role: 'user', content: msg });
  renderChatFromTranscript();

  const msgs = document.getElementById('chatMessages');
  const loadId = 'load-' + Date.now();
  msgs.innerHTML += `<div class="chat-msg ai" id="${loadId}"><div class="sender">Selenia</div><span class="loading">Pensando</span></div>`;
  msgs.scrollTop = msgs.scrollHeight;

  document.getElementById('chatSend').disabled = true;

  const councilLite = document.getElementById('councilLite').checked;

  try {
    const payload = { messages: chatTranscript, councilLite };
    const dk = (document.getElementById('dispatchKeyInput') && document.getElementById('dispatchKeyInput').value || '').trim();
    if (dk) payload.dispatchKey = dk;
    const result = await api('/ai/chat', {
      method: 'POST',
      body: JSON.stringify(payload),
    });
    const text = result.message || JSON.stringify(result);
    chatTranscript.push({ role: 'assistant', content: text });
    const el = document.getElementById(loadId);
    if (el) el.remove();
    renderChatFromTranscript();
    if (result.githubDispatch) {
      const box = document.getElementById('chatMessages');
      const g = result.githubDispatch;
      let line = '';
      if (g.ok) line = `GitHub: disparado repository_dispatch <code>${escapeHtml(g.event_type || '')}</code> en <code>${escapeHtml(g.repo || '')}</code>.`;
      else if (g.skipped) line = `GitHub dispatch omitido: ${escapeHtml(g.reason || '')}`;
      else line = `GitHub dispatch error ${escapeHtml(String(g.httpStatus || ''))}: ${escapeHtml((g.detail || '').slice(0, 280))}`;
      box.innerHTML += `<div class="chat-msg system">${line}</div>`;
      box.scrollTop = box.scrollHeight;
    }
  } catch (e) {
    chatTranscript.pop();
    const el = document.getElementById(loadId);
    if (el) el.remove();
    renderChatFromTranscript();
    const box = document.getElementById('chatMessages');
    box.innerHTML += `<div class="chat-msg ai"><div class="sender">Selenia</div><span style="color:var(--red)">Error: ${escapeHtml(e.message)}. Corré \`npm start\` o \`npm run cf:dev\` y configurá ANTHROPIC_API_KEY (ver .env.example / wrangler secret).</span></div>`;
    box.scrollTop = box.scrollHeight;
  }

  document.getElementById('chatSend').disabled = false;
  msgs.scrollTop = msgs.scrollHeight;
}

function formatAiResponse(text) {
  return text
    .replace(/\n/g, '<br>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.*?)`/g, '<code style="background:var(--surface);padding:2px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:var(--font-mono),monospace;color:var(--accent2)">$1</code>');
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// === KEYBOARD ===
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// === START ===
init();
