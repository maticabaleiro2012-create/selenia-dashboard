# Disparado por el Worker cuando el usuario escribe APROBADO_SELENIA en el chat
# (POST https://api.github.com/repos/OWNER/REPO/dispatches con event_type: selenia_approved)
name: Selenia deploy (repository_dispatch)

on:
  repository_dispatch:
    types: [selenia_approved]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
